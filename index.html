function toast(msg){ const t=document.getElementById('toast'); t.textContent=msg; t.classList.add('show'); setTimeout(()=>t.classList.remove('show'),2600); }
function esc(s){ return String(s==null?'':s).replace(/[&<>"]/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }

function openUrl(url){
  if(!url){ toast('该文件暂无可用的在线链接'); return; }
  window.open(url, '_blank');
}
function openContract(c){ openUrl(c.main); }

function fileRows(files){
  return files.map(f=>`<div class="file-row" title="点击在线查看" onclick="openUrl('${encodeURIComponent(f.url)}')"><span class="file-tag">${esc(f.tag)}</span><span class="file-name">${esc(f.name)}</span><span class="file-ext">${esc(f.ext||'')}</span></div>`).join('');
}

function render(){
  const main=document.getElementById('main');
  const kw=document.getElementById('kw').value.trim().toLowerCase();
  const y=document.getElementById('year').value;
  const t=document.getElementById('type').value;
  const list=DATA.contracts.filter(c=>{
    if(y && c.year!==y) return false;
    if(t && c.type!==t) return false;
    if(kw && !(c.no+' '+c.name).toLowerCase().includes(kw)) return false;
    return true;
  });
  document.getElementById('stat').textContent='显示 '+list.length+' / '+DATA.count+' 份合同';
  if(!list.length){ main.innerHTML='<div class="empty">没有符合条件的合同，请调整筛选条件。</div>'; return; }
  main.innerHTML=list.map(c=>{
    const toggleId='fl_'+c.no.replace(/[^0-9A-Za-z]/g,'_')+'_'+c.files.length;
    return `<div class="card"><div class="card-top">
      <span class="no">${esc(c.no)}</span><span class="name">${esc(c.name)}</span>
      <span class="badge badge-year">${esc(c.year||'未知')}年</span>
      <span class="badge badge-type">${esc(c.type)}</span>
      <span class="badge badge-file">${c.files.length}个文件</span>
      <button class="btn btn-main" onclick="openContract(${JSON.stringify(c.no)})">打开合同</button>
      <button class="btn btn-toggle" onclick="toggle('${toggleId}')">展开文件</button>
    </div><div class="filelist" id="${toggleId}">${fileRows(c.files)}</div></div>`;
  }).join('');
}

function apply(){ render(); }
function reset(){ document.getElementById('kw').value=''; document.getElementById('year').value=''; document.getElementById('type').value=''; render(); }
function toggle(id){ const el=document.getElementById(id); if(el) el.classList.toggle('open'); }

function init(){
  const contracts=DATA.contracts;
  const years=[...new Set(contracts.map(c=>c.year))].filter(Boolean).sort((a,b)=>b.localeCompare(a));
  document.getElementById('year').innerHTML='<option value="">全部年份</option>'+years.map(y=>`<option value="${y}">${y}年</option>`).join('');
  const types=[...new Set(contracts.map(c=>c.type))];
  document.getElementById('type').innerHTML='<option value="">全部类型</option>'+types.map(t=>`<option value="${t}">${t}</option>`).join('');
  document.getElementById('meta').textContent='数据源：WPS 云文档 · 合同在线查询 ｜ 共 '+DATA.count+' 份合同';
  render();
}

const PASSWORD_HASH = "e66f3d48156b2f2eaca00f7cd77efbaca729a7607f91ac271177da163f53233a";

async function sha256(s){
  const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(s));
  return Array.from(new Uint8Array(buf)).map(b=>b.toString(16).padStart(2,'0')).join('');
}
async function doLogin(){
  const v=document.getElementById('pw').value;
  let h='';
  try { h=await sha256(v); } catch(e){ h=''; }
  if(h && h===PASSWORD_HASH){
    document.getElementById('lock').style.display='none';
    document.getElementById('kw').addEventListener('input',apply);
    document.getElementById('year').addEventListener('change',apply);
    document.getElementById('type').addEventListener('change',apply);
    init();
  } else {
    document.getElementById('pwMsg').textContent='密码错误，请重试';
    document.getElementById('pw').value='';
  }
}
document.getElementById('pw').addEventListener('keydown',e=>{ if(e.key==='Enter') doLogin(); });
